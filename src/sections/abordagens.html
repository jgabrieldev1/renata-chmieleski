<section class="abordagens secao" id="abordagens" aria-labelledby="abordagens-titulo">
  <div class="envolve">
    <p class="etiqueta" data-foco id="abordagens-titulo">Como eu trabalho</p>
    <div class="abordagens__grade" data-abordagens>
      <div class="abordagens__ficha" data-foco style="--i:1">
        <div class="abordagens__ficha-topo"><span>Abordagem</span><span data-ab-sigla>TCC</span></div>
        <p class="abordagens__ficha-nome" data-ab-nome>Terapia Cognitivo-Comportamental</p>
      </div>
      <div class="abordagens__fala" data-foco style="--i:2">
        <blockquote class="abordagens__bloco">
          <p class="frase-grande frase-grande--fala" data-varredura data-ab-texto>Entender como pensamentos, emoções e atitudes se conectam, e construir novas formas de lidar com eles.</p>
        </blockquote>
        <p class="abordagens__rodape"><span data-ab-pe>Ciência com acolhimento</span><span><span data-ab-num>01</span> / 03</span></p>
      </div>
      <div class="abordagens__lado" data-foco style="--i:3">
        <figure class="abordagens__foto">
          <img class="is-ativa" src="/img/abord-tcc.webp" alt="" width="700" height="1000" loading="lazy" decoding="async">
          <img src="/img/abord-act.webp" alt="" width="700" height="1000" loading="lazy" decoding="async">
          <img src="/img/abord-familia.webp" alt="" width="700" height="1000" loading="lazy" decoding="async">
        </figure>
        <div class="setas">
          <button class="seta" data-ab="anterior" aria-label="Abordagem anterior"><svg aria-hidden="true" style="transform:scaleX(-1)"><use href="#i-seta"/></svg></button>
          <button class="seta seta--acento" data-ab="proximo" aria-label="Próxima abordagem"><svg aria-hidden="true"><use href="#i-seta"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</section>
